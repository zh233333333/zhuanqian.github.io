<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>测一测｜你适合靠什么赚钱</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#FAF8F3;
  --ink:#22252A;
  --ink-2:#5E636B;
  --ink-3:#9A9E9F;
  --line:#E8E3D8;
  --mint:#7FBFA8;
  --card:#FFFFFF;
  --serif:'Noto Serif SC',"Songti SC",Georgia,serif;
  --sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  overflow-x:hidden;
}
/* ===== 背景装饰 ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(26px);opacity:.55}
.b1{width:52vmax;height:52vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle at 40% 40%,#D8EBDD,#D8EBDD00 70%)}
.b2{width:44vmax;height:44vmax;right:-16vmax;top:8vmax;background:radial-gradient(circle at 50% 50%,#FBE0D3,#FBE0D300 70%)}
.b3{width:48vmax;height:48vmax;left:10vmax;bottom:-26vmax;background:radial-gradient(circle at 50% 50%,#E3E0F2,#E3E0F200 70%)}
.grain{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(#00000008 1px,transparent 1px);background-size:22px 22px}

/* ===== 视图容器 ===== */
.view{display:none;position:relative;z-index:1;min-height:100dvh;padding:clamp(22px,5.4vw,56px) clamp(20px,5vw,40px)}
.view.active{display:flex;flex-direction:column}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view.active{animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}

/* ===== 首页 ===== */
#home{justify-content:center}
.home-inner{width:100%;max-width:660px;margin:auto;text-align:center;padding-bottom:2vh}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;letter-spacing:.06em;color:var(--ink-2);
  background:#ffffffad;border:1px solid var(--line);border-radius:999px;
  padding:7px 15px;backdrop-filter:blur(6px);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px #7FBFA822}
h1{margin:clamp(26px,6vw,44px) 0 0;font-family:var(--serif);font-weight:500;line-height:1.22;text-wrap:balance}
.h1-top{display:block;font-size:clamp(15px,3.6vw,18px);letter-spacing:.28em;color:var(--ink-2);margin-bottom:14px;font-family:var(--sans);font-weight:400}
.h1-main{display:block;font-size:clamp(38px,10.6vw,62px);letter-spacing:.02em}
.h1-main em{font-style:normal;position:relative;z-index:0;padding:0 .06em}
.h1-main em::after{content:"";position:absolute;left:-.06em;right:-.06em;bottom:.12em;height:.34em;background:#F6E3C4;border-radius:3px;z-index:-1;transform:rotate(-.7deg)}
.lede{
  margin:clamp(20px,4.6vw,28px) auto 0;max-width:30em;
  font-size:clamp(14px,3.7vw,16px);line-height:1.9;color:var(--ink-2);font-weight:300;
}
.start{
  margin-top:clamp(28px,6vw,40px);
  appearance:none;border:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:12px;
  background:var(--ink);color:#FFFDF7;
  font-family:var(--sans);font-size:clamp(15px,4vw,17px);font-weight:500;letter-spacing:.04em;
  padding:clamp(14px,3.6vw,18px) clamp(26px,7vw,38px);
  border-radius:999px;
  box-shadow:0 18px 34px -18px rgba(34,37,42,.6);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s;
}
.start span{transition:transform .25s}
.start:hover{transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(34,37,42,.65);background:#15181C}
.start:hover span{transform:translateX(4px)}
.start:active{transform:scale(.975)}
.home-note{margin-top:22px;font-size:12px;color:var(--ink-3);letter-spacing:.03em}
.home-foot{margin-top:auto;padding-top:26px;font-size:11.5px;color:var(--ink-3);text-align:center}

/* ===== 答题页 ===== */
#quiz{min-height:100dvh}
.q-head{
  width:100%;max-width:640px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
}
.back{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:#ffffffc4;color:var(--ink-2);
  font-size:15px;cursor:pointer;display:grid;place-items:center;
  transition:background .2s,color .2s,opacity .2s,transform .2s;
}
.back:hover{background:#fff;color:var(--ink)}
.back:active{transform:scale(.94)}
.back:disabled{opacity:.28;cursor:default}
.q-track{flex:1 1 auto;height:5px;background:#E9E4D9;border-radius:999px;overflow:hidden}
.q-track i{display:block;height:100%;width:4%;border-radius:999px;background:linear-gradient(90deg,#A8D3C0,#7FBFA8);transition:width .42s cubic-bezier(.25,.9,.3,1)}
.q-count{flex:0 0 auto;font-size:12.5px;letter-spacing:.05em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.q-count b{color:var(--ink);font-weight:500;font-size:15px}
.q-stage{width:100%;max-width:640px;margin:clamp(24px,6vw,44px) auto 0;flex:1 1 auto}
.q-card{animation:qIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes qIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.q-chip{
  display:inline-block;font-size:11.5px;letter-spacing:.16em;color:#7C817F;
  border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:4px 11px;
}
.q-title{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(19px,5.2vw,26px);line-height:1.62;letter-spacing:.015em;
  margin:14px 0 clamp(18px,4.6vw,26px);text-wrap:balance;
}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  position:relative;display:flex;align-items:flex-start;gap:12px;
  width:100%;text-align:left;cursor:pointer;appearance:none;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 42px 14px 14px;
  font-family:var(--sans);font-size:clamp(14px,3.9vw,15.5px);line-height:1.55;color:var(--ink);
  box-shadow:0 1px 0 #00000005;
  transition:border-color .2s,background .2s,transform .18s,box-shadow .2s;
}
.opt .key{
  flex:0 0 auto;width:25px;height:25px;border-radius:8px;background:#F2EDE2;
  display:grid;place-items:center;font-size:11.5px;font-weight:600;color:#8C8577;
  transition:background .2s,color .2s;
}
.opt .tick{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;border-radius:50%;background:var(--mint);color:#fff;
  display:grid;place-items:center;font-size:11px;
  opacity:0;transition:opacity .2s;
}
@media (hover:hover){
  .opt:hover{border-color:#CFC8B7;background:#FFFEFB;transform:translateY(-1px);box-shadow:0 10px 22px -18px rgba(34,37,42,.5)}
  .opt:hover .key{background:#E9E2D2}
}
.opt:active{transform:scale(.985)}
.opt.done{border-color:var(--mint);background:#FCFEFC;box-shadow:0 10px 24px -18px rgba(47,110,88,.45)}
.opt.done .key{background:var(--mint);color:#fff}
.opt.done .tick{opacity:1}
.q-tip{margin:16px 2px 0;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.q-foot{margin-top:auto;padding-top:22px;font-size:11.5px;color:var(--ink-3);text-align:center}

/* 计算中遮罩 */
.computing{
  position:fixed;inset:0;z-index:9;display:none;place-items:center;
  background:#FAF8F3f2;backdrop-filter:blur(6px);
}
.computing.show{display:grid;animation:viewIn .35s both}
.computing .inner{text-align:center}
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:pulse 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s;background:#F2B5A0}
.dots i:nth-child(3){animation-delay:.36s;background:#AFA6DC}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1);opacity:1}}
.computing p{margin:0;font-family:var(--serif);font-size:15px;color:var(--ink-2);letter-spacing:.04em}

/* ===== 结果页 ===== */
#result{padding-top:clamp(20px,4.6vw,40px);padding-bottom:clamp(26px,6vw,46px)}
.res-wrap{width:100%;max-width:640px;margin:0 auto}
.res-hero{
  position:relative;border-radius:26px;padding:clamp(22px,5.4vw,32px);
  border:1px solid var(--line);
  background:
    radial-gradient(130% 110% at 0% 0%, var(--tint,#E7EFE8) 0%, #FFFFFF 62%);
  box-shadow:0 22px 44px -34px rgba(34,37,42,.55);
  animation:viewIn .5s both;
}
.res-eyebrow{margin:0;font-size:11.5px;letter-spacing:.2em;color:var(--ink-2)}
.res-name{
  margin:10px 0 4px;font-family:var(--serif);font-weight:700;
  font-size:clamp(30px,8.4vw,46px);line-height:1.25;letter-spacing:.03em;color:var(--acc,#3D6B57);
}
.res-sub{margin:0;font-size:clamp(13px,3.6vw,15px);color:var(--ink-2);letter-spacing:.02em}
.res-sub2{margin:6px 0 0;font-size:12px;color:var(--ink-3)}
.slogan{
  margin:clamp(18px,4.4vw,24px) 0 0;display:flex;align-items:center;gap:10px;
  background:#ffffffcc;border:1px dashed #D9D3C4;border-radius:14px;padding:12px 14px;
  backdrop-filter:blur(4px);
}
.slogan p{margin:0;flex:1 1 auto;font-family:var(--serif);font-size:clamp(14.5px,3.9vw,17px);line-height:1.6;color:#33373B}
.copy-mini{
  flex:0 0 auto;appearance:none;border:1px solid #DFD9CB;background:#FFFDF7;color:var(--ink-2);
  font-family:var(--sans);font-size:11.5px;padding:6px 11px;border-radius:999px;cursor:pointer;
  transition:background .2s,color .2s;
}
.copy-mini:hover{background:#fff;color:var(--ink)}

.meter{margin-top:clamp(18px,4.4vw,24px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meter .lab{font-size:11.5px;letter-spacing:.06em;color:var(--ink-2)}
.cells{display:flex;gap:5px}
.cells i{width:17px;height:6px;border-radius:3px;background:#DED9CD}
.cells i.on{background:var(--acc,#3D6B57);opacity:.85}
.meter .val{font-size:12px;color:var(--ink-2)}
.meter-note{margin:8px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink-2);font-weight:300}

.dims{margin-top:clamp(18px,4.4vw,24px);padding-top:16px;border-top:1px solid #EDE8DC}
.dims-title{margin:0 0 12px;font-size:11.5px;letter-spacing:.14em;color:var(--ink-3)}
.dim-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dim-row .n{flex:0 0 46px;font-size:11.5px;color:var(--ink-2)}
.dim-row .track{flex:1 1 auto;height:4px;background:#EDE8DC;border-radius:999px;overflow:hidden}
.dim-row .track i{display:block;height:100%;border-radius:999px;background:#C9C3B4;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.dim-row.top .track i{background:var(--acc,#3D6B57)}
@keyframes grow{from{width:0!important}}

.res-block{
  margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:clamp(18px,4.6vw,26px);
  box-shadow:0 16px 34px -34px rgba(34,37,42,.4);
  animation:viewIn .5s both;
}
.res-block:nth-of-type(2){animation-delay:.06s}
.res-block:nth-of-type(3){animation-delay:.12s}
.res-block:nth-of-type(4){animation-delay:.18s}
.res-block h3{
  margin:0 0 12px;font-size:12px;letter-spacing:.16em;color:var(--ink-3);font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.res-block h3::before{content:"";width:14px;height:2px;background:var(--acc,#7FBFA8);border-radius:2px}
.res-block p{margin:0 0 10px;font-size:clamp(14px,3.8vw,15px);line-height:1.85;color:#33373B;font-weight:300}
.res-block p:last-child{margin-bottom:0}
.res-block p b{font-weight:500;color:var(--ink)}
.easter{
  margin-top:12px;background:#FCFAF3;border:1px solid #EFE8D8;border-radius:14px;padding:12px 14px;
  font-size:13px;line-height:1.75;color:var(--ink-2);font-weight:300;
}
.easter b{color:#8A6E3F;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chips span{
  font-size:12.5px;color:#40454A;background:#F5F2E9;border:1px solid #E9E3D3;
  border-radius:999px;padding:6px 12px;
}
.one-line{margin-top:14px!important;font-family:var(--serif);font-size:clamp(14px,3.8vw,16px)!important;color:#2B2F33!important;line-height:1.75!important}

.res-actions{margin-top:clamp(20px,5vw,28px);display:flex;gap:10px;flex-wrap:wrap}
.btn{
  flex:1 1 140px;appearance:none;cursor:pointer;border-radius:999px;
  font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:.03em;
  padding:14px 18px;transition:transform .2s,background .2s,box-shadow .2s;
}
.btn.main{background:var(--ink);color:#FFFDF7;border:1px solid var(--ink);box-shadow:0 16px 30px -20px rgba(34,37,42,.8)}
.btn.main:hover{background:#15181C;transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#FFFDF7}
.btn:active{transform:scale(.98)}
.share-hint{
  margin-top:calc(14px + clamp(0px,1vw,6px));text-align:center;font-size:12px;color:var(--ink-3);line-height:1.8;
}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:#22252A;color:#FFFDF7;font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;max-width:82vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:400px){
  .q-title{font-size:19px}
  .opt{padding:13px 40px 13px 13px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="grain"></span>
</div>

<!-- ===== 视图：首页 ===== -->
<section id="home" class="view active">
  <div class="home-inner">
    <div class="badge"><span class="dot"></span>人格测试 · 30 题 · 约 3 分钟</div>
    <h1>
      <span class="h1-top">测一测</span>
      <span class="h1-main">你适合<em>靠什么</em>赚钱</span>
    </h1>
    <p class="lede">
      不用懂赚钱，也不用准备答案。<br>
      30 道日常小事，全凭第一反应选，<br>
      看看你的性格最会往哪个方向长出钱来。
    </p>
    <button class="start" id="startBtn">开始测试 <span aria-hidden="true">→</span></button>
    <p class="home-note">没有标准答案 · 不考知识 · 结果仅供娱乐与自我观察</p>
  </div>
  <div class="home-foot">做完可以直接截图，问问朋友是哪种</div>
</section>

<!-- ===== 视图：答题 ===== -->
<section id="quiz" class="view">
  <div class="q-head">
    <button class="back" id="backBtn" aria-label="上一题">←</button>
    <div class="q-track"><i id="barFill"></i></div>
    <div class="q-count"><b id="qNow">01</b><span> / 30</span></div>
  </div>
  <div class="q-stage" id="qStage"></div>
  <div class="q-foot">凭第一感觉选，不必想太久</div>
</section>

<!-- ===== 视图：结果 ===== -->
<section id="result" class="view">
  <div class="res-wrap" id="resStage"></div>
</section>

<div class="computing" id="computing">
  <div class="inner">
    <div class="dots"><i></i><i></i><i></i></div>
    <p>正在把你的 30 个习惯拼起来…</p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// ===== 六个性格维度 =====
// W 秩序感 / C 行动力 / L 关系力 / J 专注力 / G 表达力 / A 洞察力
const DIM_NAMES = {
  W:'秩序感', C:'行动力', L:'关系力', J:'专注力', G:'表达力', A:'洞察力'
};

// ===== 30 道生活场景题（p 为主倾向 +2，s 为副倾向 +1）=====
const QUESTIONS = [
  {q:'周末醒来，窗外刚亮。你第一件事更接近——', o:[
    {t:'先把屋子收拾一圈，顺手想想今天要做什么', p:'W', s:'J'},
    {t:'摸到手机，看看有没有人约我', p:'L', s:'G'},
    {t:'躺着，脑子里冒出一件从没试过的事', p:'C', s:'G'},
    {t:'打开那个放了很久的小项目，接着琢磨', p:'J', s:'W'}
  ]},
  {q:'群里有人甩来一条没头没尾的链接——', o:[
    {t:'先看是谁发的、在什么话头下发的', p:'A', s:'J'},
    {t:'直接点开，看完再说', p:'C', s:'G'},
    {t:'回一句“这是啥呀”，等别人补充', p:'L', s:'A'},
    {t:'默默点开，看完自己在心里存档', p:'J', s:'A'}
  ]},
  {q:'排队结账，前面的人卡住了——', o:[
    {t:'观察收银员的手速，判断要不要换队', p:'A', s:'W'},
    {t:'立刻挪到另一条队，赌它更快', p:'C', s:'A'},
    {t:'跟旁边等的人聊两句，时间过得快点', p:'L', s:'G'},
    {t:'掏出手机，把清单上的待办清掉一条', p:'W', s:'J'}
  ]},
  {q:'一箱家具、一张全是图看不懂的说明书——', o:[
    {t:'先把零件按顺序摆好，再一格一格对', p:'W', s:'J'},
    {t:'先拧两下试试，错了再拆', p:'C', s:'J'},
    {t:'拍张照发群里，问谁装过', p:'L', s:'A'},
    {t:'搜个视频，边看边跟着做', p:'G', s:'C'}
  ]},
  {q:'朋友突然说“我最近有点累”，你——', o:[
    {t:'先不急着安慰，听他把话说完', p:'A', s:'J'},
    {t:'立刻问：要不要出来吃个饭', p:'L', s:'C'},
    {t:'讲个自己更惨的事，把他逗笑', p:'G', s:'L'},
    {t:'帮他排一遍：问题是什么，先解决哪一件', p:'W', s:'A'}
  ]},
  {q:'回家路上有一条从没走过的小巷——', o:[
    {t:'拐进去，反正绕一点也能到', p:'C', s:'G'},
    {t:'先看一眼地图，确认不会走进死路', p:'W', s:'A'},
    {t:'拍张照，觉得这个光很好看', p:'G', s:'A'},
    {t:'记一下，下次带朋友一起来', p:'L', s:'G'}
  ]},
  {q:'点外卖，手指停在列表上——', o:[
    {t:'还是那家，闭眼点也不会错', p:'W', s:'J'},
    {t:'找没吃过的新店，难吃也算体验', p:'C', s:'G'},
    {t:'看到有人拼单，顺手拉上同事', p:'L', s:'A'},
    {t:'翻完差评，挑一家最稳的', p:'A', s:'W'}
  ]},
  {q:'电影开场十分钟了你才到——', o:[

const state = { idx:0, answers:new Array(QUESTIONS.length).fill(null), locked:false };
const $ = (s)=>document.querySelector(s);
const views = { home:$('#home'), quiz:$('#quiz'), result:$('#result') };

function showView(name){
  Object.values(views).forEach(v=>v.classList.remove('active'));
  views[name].classList.add('active');
  window.scrollTo(0,0);
}

// ===== 答题渲染 =====
const LET = ['A','B','C','D'];

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  const picked = state.answers[state.idx];
  const card = document.createElement('div');
  card.className = 'q-card';
  card.innerHTML = `
    <span class="q-chip">Q${String(state.idx+1).padStart(2,'0')}</span>
    <h2 class="q-title">${q.q}</h2>
    <div class="opts"></div>
    <p class="q-tip">没有标准答案，选最像你的那一个</p>
  `;
  const box = card.querySelector('.opts');
  q.o.forEach((op,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (picked===i ? ' done' : '');
    b.dataset.i = i;
    b.innerHTML = `<span class="key">${LET[i]}</span><span class="txt">${op.t}</span><span class="tick">✓</span>`;
    b.addEventListener('click',(e)=>onPick(e,i,b));
    box.appendChild(b);
  });
  $('#qStage').replaceChildren(card);

  $('#qNow').textContent = String(state.idx+1).padStart(2,'0');
  const done = state.answers.filter(a=>a!==null).length;
  $('#barFill').style.width = Math.max(4, Math.round((done / QUESTIONS.length) * 100)) + '%';
  $('#backBtn').disabled = state.idx === 0;
}

// 手机上防止滑动时误选：位移超过 12px 的点击不算选择
let ptDown = {x:0,y:0};
document.addEventListener('pointerdown',(e)=>{ ptDown.x = e.clientX; ptDown.y = e.clientY; },{passive:true});

function onPick(e, i, el){
  if(state.locked) return;
  if(Math.hypot((e.clientX||0)-ptDown.x, (e.clientY||0)-ptDown.y) > 12) return;

  state.answers[state.idx] = i;
  el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('done'));
  el.classList.add('done');

  const done = state.answers.filter(a=>a!==null).length;
  $('#barFill').style.width = Math.max(4, Math.round((done / QUESTIONS.length) * 100)) + '%';

  state.locked = true;
  setTimeout(()=>{
    if(state.idx < QUESTIONS.length - 1){
      state.idx++;
      renderQuestion();
      state.locked = false;
    }else{
      finish();
    }
  }, 290);
}

$('#startBtn').addEventListener('click',()=>{
  state.idx = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.locked = false;
  showView('quiz');
  renderQuestion();
});

$('#backBtn').addEventListener('click',()=>{
  if(state.locked || state.idx === 0) return;
  state.idx--;
  renderQuestion();
});

// ===== 结果计算 =====
function compute(){
  const score = {W:0,C:0,L:0,J:0,G:0,A:0};
  const avail = {W:0,C:0,L:0,J:0,G:0,A:0};

  QUESTIONS.forEach((q,qi)=>{
    const sel = state.answers[qi];
    q.o.forEach((op,oi)=>{
      const w = oi === sel ? 1 : 0;
      score[op.p] += 2 * w;
      avail[op.p] += 2;
      if(op.s){ score[op.s] += 1 * w; avail[op.s] += 1; }
    });
  });

  // 用“实际得分 / 可得分”消除题目分布带来的偏差
  const rate = {};
  Object.keys(score).forEach(k=>{ rate[k] = score[k] / (avail[k] || 1); });

  const ranked = Object.keys(rate).sort((a,b)=> rate[b] - rate[a]);
  const total = Object.values(score).reduce((a,b)=>a+b,0) || 1;
  const hhi = Object.values(score).reduce((acc,v)=> acc + Math.pow(v/total,2), 0);

  return { score, rate, ranked, hhi };
}

function innerLevel(hhi){
  if(hhi >= 0.42) return {cells:2, label:'偏低', note:'你选东西不太犹豫，心里像一直有杆秤。真正费神的不是选择，是别人中途变卦。'};
  if(hhi >= 0.28) return {cells:3, label:'中等', note:'关键时刻你会反复想一会儿，但基本不会卡太久。你的内耗多半花在“要不要先开始”上。'};
  return {cells:4, label:'偏高', note:'你脑子里常有两个小人在开会：一个说冲，一个说等等。这份纠结也是你能看懂别人的原因。'};
}

function finish(){
  $('#computing').classList.add('show');
  setTimeout(()=>{
    $('#computing').classList.remove('show');
    renderResult();
    state.locked = false;
  }, 900);
}

    return `<div class="dim-row ${k===topKey?'top':''}">
      <span class="n">${DIM_NAMES[k]}</span>
      <span class="track"><i style="width:${w}%;animation-delay:${Math.random()*0.2}s"></i></span>
    </div>`;
  }).join('');

  const nearTie = rate[secondKey] >= rate[topKey] * 0.88;
  const shareText = `我测出来是「${r.name}」型赚钱人格——${r.slogan}\n你呢？搜“测一测｜你适合靠什么赚钱”来对一下。`;

  $('#resStage').innerHTML = `
    <div class="res-hero" style="--tint:${r.tint};--acc:${r.acc}">
      <p class="res-eyebrow">YOUR MONEY PERSONA · 30/30</p>
      <h2 class="res-name">「${r.name}」</h2>
      <p class="res-sub">${r.sub}</p>
      <p class="res-sub2">${nearTie ? `副线人格：${RESULTS[secondKey].name}　·　` : ''}六维主倾向：${DIM_NAMES[topKey]}</p>

      <div class="slogan">
        <p>“${r.slogan}”</p>
        <button class="copy-mini" data-copy="slogan">复制</button>
      </div>

      <div class="meter">
        <span class="lab">精神内耗指数</span>
        <span class="cells">${[1,2,3,4,5].map(n=>`<i class="${n<=lv.cells?'on':''}"></i>`).join('')}</span>
        <span class="val">${lv.label}</span>
      </div>
      <p class="meter-note">${lv.note}</p>

      <div class="dims">
        <p class="dims-title">你的六维分布</p>
        ${dimRows}
      </div>
    </div>

    <div class="res-block">
      <h3>为什么是你</h3>
      ${r.why.map(t=>`<p>${t}</p>`).join('')}
    </div>

    <div class="res-block">
      <h3>隐藏特质 & 小彩蛋</h3>
      <p>${r.hidden}</p>
      <div class="easter"><b>彩蛋 ·</b> ${r.easter}</div>
    </div>

    <div class="res-block">
      <h3>适合你的路子</h3>
      <div class="chips">${r.ways.map(w=>`<span>${w}</span>`).join('')}</div>
      <p class="one-line">${r.one}</p>
    </div>

    <div class="res-actions">
      <button class="btn main" id="retryBtn">重新测一次</button>
      <button class="btn ghost" id="shareBtn">复制分享文案</button>
    </div>
    <p class="share-hint">把页面截图发出去，问一句“你的赚钱类型是哪个？”<br>换一个人测，答案通常完全不一样。</p>
  `;

  showView('result');

  $('#resStage [data-copy="slogan"]').addEventListener('click',(e)=>{
    copyText(r.slogan, e.currentTarget);
  });
  $('#retryBtn').addEventListener('click',()=>{
    state.idx = 0;
    state.answers = new Array(QUESTIONS.length).fill(null);
    state.locked = false;
    showView('quiz');
    renderQuestion();
  });
  $('#shareBtn').addEventListener('click',(e)=>{
    copyText(shareText, e.currentTarget);
  });
}

// ===== 复制与提示 =====
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1900);
}

function copyText(text, btn){
  const done = ()=>{
    toast('已复制，去粘给朋友吧');
    if(btn){ const old = btn.textContent; btn.textContent = '已复制'; setTimeout(()=>{ btn.textContent = old; }, 1600); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('长按选中文字复制即可'); }
  document.body.removeChild(ta);
}

// 首次进入
renderQuestion();
</script>
